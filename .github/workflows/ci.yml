name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Las mismas versiones que fija app/build.gradle.kts; la imagen del runner
      # no garantiza traerlas.
      - name: SDK, NDK y CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Compilar
        run: ./gradlew :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: uvpainter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
